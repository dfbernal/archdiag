# Releases on every merge to main. package.json's version is the single source of truth:
#   - not on npm yet  -> run the checks, publish it to npm, create tag v<version> and a GitHub release
#                        (pre-release for versions like 0.1.0-beta.1) with the package tarball attached
#   - already on npm  -> nothing to publish; if its GitHub release is missing, create it (with the tarball)
#   - lower than what's on npm, or not valid semver -> fail
# Re-running is safe: each step is skipped once it's done.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in GitHub. Configured on npmjs.com for
# package `archdiag` with user `dfbernal`, repository `archdiag`, workflow filename `publish.yml` (keep this name).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:     # re-run by hand from the Actions tab if needed

permissions:
  contents: write   # create the tag and the GitHub release
  id-token: write   # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false   # never interrupt a publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # no caches in release builds

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Work out what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release-plan.mjs --github-output
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then released=true; else released=false; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Stop on a bad version
        if: steps.plan.outputs.action == 'error'
        run: |
          echo "::error::${{ steps.plan.outputs.message }}"
          exit 1

      - name: Summary
        run: |
          {
            echo "### ${{ steps.plan.outputs.message }}"
            echo "GitHub release ${{ steps.plan.outputs.tag }}: ${{ steps.plan.outputs.released == 'true' && 'exists' || 'will be created' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.plan.outputs.action == 'publish' || steps.plan.outputs.released == 'false'
        run: npm ci

      - name: Quality gate (every example must pass the layout checks)
        if: steps.plan.outputs.action == 'publish'
        run: npm run check

      - name: Publish to npm
        if: steps.plan.outputs.action == 'publish'
        run: npm publish --tag "${{ steps.plan.outputs.dist_tag }}" --access public

      - name: Create the GitHub release with the package tarball
        if: steps.plan.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          npm pack
          flags=(--title "archdiag $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "archdiag-$VERSION.tgz" "${flags[@]}"
