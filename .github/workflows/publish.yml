# Publishes to npm when a GitHub release is published.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. One-time setup on npmjs.com:
# package `archdiag` -> Settings -> Trusted publishing -> GitHub Actions, with
#   user: dfbernal, repository: archdiag, workflow filename: publish.yml
# (the package must exist first, so the very first version is published by hand; see RELEASING.md).
#
# Release tag must be v<version from package.json>, e.g. v0.1.0-beta.1.
# Prereleases (0.1.0-beta.1) go to the npm dist-tag named after them ("beta"); others go to "latest".
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write   # attach the package tarball to the GitHub release
  id-token: write   # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # no caches in release builds

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Quality gate (every example must pass the layout checks)
        run: npm run check

      - name: Publish
        run: |
          case "$VERSION" in
            *-*) tag=$(echo "$VERSION" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/') ;;   # 0.1.0-beta.1 -> beta
            *)   tag=latest ;;
          esac
          # Already on npm (e.g. the first version, published by hand): skip, but still attach the tarball below.
          if [ -n "$(npm view "archdiag@$VERSION" version 2>/dev/null)" ]; then
            echo "archdiag@$VERSION is already on npm; not publishing it again."
            exit 0
          fi
          echo "Publishing archdiag@$VERSION with dist-tag '$tag'"
          npm publish --tag "$tag" --access public

      - name: Attach the package tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release upload "$GITHUB_REF_NAME" "archdiag-$VERSION.tgz" --clobber
